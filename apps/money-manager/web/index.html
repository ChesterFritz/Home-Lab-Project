<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E9EDF5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090B12" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pitaka" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pitaka</title>
    <script>
      try {
        var r = document.documentElement, t = localStorage.getItem("pitaka-theme");
        if (t === "light" || t === "dark") r.dataset.theme = t;
        if (localStorage.getItem("pitaka-skin") === "anime") {
          var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          r.dataset.anime = dark ? "chuuni" : "manga";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
